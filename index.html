<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weight Protocol</title>
        <link rel="stylesheet" href="./style.css">
        <script src="./script.js" defer></script>
    </head>
    <body>
        <h1 id="title">Weight Protocol</h1>

        <form id="weightForm">
            <div class="field">
                <label for="dateInput">Date:</label>
                <input type="date" id="dateInput" required>
            </div>
            <div class="field">
                <label for="weightInput" id="weightFieldLabel">Weight (kg):</label>
                <input type="number" id="weightInput" step="0.1" required>
            </div>
            <input type="submit" value="Submit">
            <button type="button" id="goalButton">Goal</button>
            <button type="button" id="settingsButton">Settings</button>
        </form>
        <svg id="graph" width="600" height="400"></svg>
        <div id="monthNav">
            <button id="prevMonth">◀</button>
            <span id="monthLabel"></span>
            <button id="nextMonth">▶</button>
        </div>
        <div id="monthStats"></div>

        <div id="entryPopup" class="hidden">
            <form id="popupForm">
                <div class="field">
                    <label for="popupDate">Date:</label>
                    <input type="date" id="popupDate" required>
                </div>
                <div class="field">
                    <label for="popupWeight" id="popupWeightFieldLabel">Weight (kg):</label>
                    <input type="number" id="popupWeight" step="0.1" required>
                </div>
                <div id="popupActions">
                    <button type="submit">Save</button>
                    <button type="button" id="popupDelete">Delete</button>
                    <button type="button" id="popupClose">Close</button>
                </div>
            </form>
        </div>

        <div id="settingsPanel" class="hidden">
            <h2>Settings</h2>
            <div class="field">
                <label for="unitSelect">Unit:</label>
                <select id="unitSelect">
                    <option value="kg">kg</option>
                    <option value="lbs">lbs</option>
                </select>
            </div>
            <div class="field">
                <label for="dateFormatSelect">Date format:</label>
                <select id="dateFormatSelect">
                    <option value="dd.mm.yyyy">dd.mm.yyyy</option>
                    <option value="mm/dd/yyyy">mm/dd/yyyy</option>
                    <option value="yyyy-mm-dd">yyyy-mm-dd</option>
                </select>
            </div>
            <div class="field">
                <label for="movingAveragesWindowInput">Moving average (entries):</label>
                <input type="number" id="movingAveragesWindowInput" min="1" step="1">
            </div>
            <div id="settingsActions">
                <button type="button" id="settingsClearButton">Clear all data</button>
                <button type="button" id="settingsCloseButton">Close</button>
            </div>
        </div>
    </body>
</html>
